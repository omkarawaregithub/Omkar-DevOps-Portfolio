# SonarQube Project Configuration
# Omkar Aware — DevOps Engineer Portfolio

# Project Identification
sonar.projectKey=omkar-portfolio
sonar.projectName=Omkar Aware - DevOps Engineer Portfolio
sonar.projectVersion=1.0.0

# Source Code
sonar.sources=src/
sonar.sourceEncoding=UTF-8

# Exclusions
# Exclude node_modules, build artifacts, test setup, and node_modules
sonar.exclusions=**/*.test.tsx,**/*.test.ts,src/test/**,node_modules/**,dist/**,coverage/**

# Test-specific exclusions
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts
sonar.tests=src/test/

# Coverage
# Vitest coverage report (generated with npm test)
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language Detection
sonar.language=js

# Analysis Scope
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
